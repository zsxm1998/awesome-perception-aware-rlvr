name: checks

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint, license headers and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit -c scripts/constraints.txt

      # the checks of .pre-commit-config.yaml, as contributors run them locally: ruff (lint and format, pinned),
      # license headers, shell syntax, paper list and Markdown links, and the generic file checks
      - name: pre-commit
        env:
          SKIP: no-commit-to-branch  # this workflow also runs on main
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: unit tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/constraints.txt

      # GitHub-hosted runners have no GPU: install CPU PyTorch and skip vLLM / flash-attn. Tests that
      # need vLLM are skipped by tests/conftest.py; GPU training and evaluation are not run in CI.
      - name: Install CPU dependencies
        run: |
          pip install torch==2.10.0 torchvision --index-url https://download.pytorch.org/whl/cpu
          grep -v -E '^(vllm|flash-attn)' requirements.txt > "$RUNNER_TEMP/requirements-cpu.txt"
          pip install -r "$RUNNER_TEMP/requirements-cpu.txt" pytest -c scripts/constraints.txt

      - name: Unit tests
        run: python -m pytest -q tests/
