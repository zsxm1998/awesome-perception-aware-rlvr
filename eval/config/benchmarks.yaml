# Benchmark registry. Paths are relative to the evaluation data root
# (default <repo>/data/eval; override with --data-root or $EVAL_DATA_ROOT) and match the
# layout written by `python -m eval.prepare <key>` / `bash scripts/prepare_eval_data.sh <key>`.
#
# Fields: key, label, group (columns are averaged per group in the summaries), loader,
# scorer, primary_metric, source (upstream dataset, informational), path/paths, image_root,
# generation defaults (max_new_tokens, temperature, top_p, num_samples; the runner flags
# --temperature/--num-samples/--max-new-tokens/--top-p override them for every benchmark),
# requires_judge (benchmark is skipped with a warning unless an LLM judge is configured),
# optional (excluded from the `all` suite and `prepare all`), metadata (loader/scorer options).

benchmarks:
  # ---------------------------------------------------------------------------
  # Reasoning: PAPO-Eval protocol (rule-based exact match on the last \boxed{},
  # mean accuracy over 8 samples at temperature 1.0, top_p 1.0, 2048 new tokens).
  # ---------------------------------------------------------------------------
  - key: geo3k
    label: Geo3k
    group: Reasoning
    loader: sharegpt
    scorer: boxed_exact_match
    primary_metric: mean_acc_at_k
    source: PAPO-Galaxy/PAPO_eval (hiyouga_geometry3k)
    path: geo3k/test.parquet
    image_root: geo3k
    max_new_tokens: 2048
    temperature: 1.0
    top_p: 1.0
    num_samples: 8

  - key: mathvista
    label: MathVista
    group: Reasoning
    loader: sharegpt
    scorer: boxed_exact_match
    primary_metric: mean_acc_at_k
