      - pope/random.parquet
      - pope/popular.parquet
      - pope/adversarial.parquet
    max_new_tokens: 2048
    temperature: 0.0
    num_samples: 1

  - key: hallusionbench
    label: HallusionBench
    group: Perception
    loader: hallusionbench
    scorer: hallusionbench
    primary_metric: question_accuracy
