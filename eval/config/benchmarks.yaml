  # ---------------------------------------------------------------------------
  # General multimodal benchmarks (VA-OPD, VCSD and Vision-OPD tables), greedy, single
  # sample: option accuracy with rule-based letter extraction; MMMU scores its open
  # questions with the rule-based answer matching of the official MMMU evaluation.
  # ---------------------------------------------------------------------------
  - key: mmstar
    label: MMStar
    group: Perception
    loader: mmstar
    scorer: mcq
    primary_metric: overall_accuracy
    source: Lin-Chen/MMStar (val)
    path: mmstar/val.parquet
    max_new_tokens: 2048
    temperature: 0.0
    num_samples: 1
    metadata:
      aggregate: micro

  - key: blink
    label: BLINK (val)
    group: Perception
    loader: blink
    scorer: mcq
    primary_metric: overall_accuracy
    source: BLINK-Benchmark/BLINK (14 subtasks, val)
