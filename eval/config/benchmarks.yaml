  # ---------------------------------------------------------------------------
  # Grounding. GRIT sets (official GRIT_data annotations) follow the GRIT paper: answer
  # accuracy (rule-based here) and the GRIT grounding IoU (union of all predicted boxes vs
  # union of GT boxes, details key grounding/grit_iou). OVDEval reports the grounding IoU only.
  # tallyqa_relabeled asks the GRIT TallyQA questions with one GT box per counted instance and
  # corrected answers (zsxm1998/GRIT-TallyQA-Relabeled); it is not comparable with grit_tallyqa.
  # Predicted boxes are read according to the runner's --box-format.
  # ---------------------------------------------------------------------------
  - key: grit_vsr
    label: GRIT-VSR
    group: Grounding
    loader: grit_jsonl
    scorer: answer_bbox
    primary_metric: answer_accuracy
    source: yfan1997/GRIT_data (vsr_val) + COCO 2017 images
    path: grit_vsr/vsr_val.jsonl
    image_root: grit_vsr/images
    max_new_tokens: 2048
    temperature: 0.0
    num_samples: 1

  - key: grit_tallyqa
    label: GRIT-TallyQA
    group: Grounding
    loader: grit_jsonl
    scorer: answer_bbox
    primary_metric: answer_accuracy
    source: yfan1997/GRIT_data (tallyqa_val) + Visual Genome images
