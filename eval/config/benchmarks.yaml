  # ---------------------------------------------------------------------------
  # CFPO real-world benchmarks (RavenInJuly/CFPO_Datasets), scored like CFPO's
  # Counterfactual-Eval: mathruler grade_answer on the last \boxed{} (whole response when
  # there is no box), any of the reference answers counts, mean accuracy over 8 samples.
  # ---------------------------------------------------------------------------
  - key: cvqa_real
    label: C-VQA-Real
    group: Perception
    loader: cfpo_json
    scorer: cfpo_match
    primary_metric: mean_acc_at_k
    source: RavenInJuly/CFPO_Datasets (C-VQA-Real_test) + COCO val2014 images
    path: cvqa_real/test.json
    image_root: cvqa_real/images
    max_new_tokens: 2048
    temperature: 1.0
    top_p: 1.0
    num_samples: 8

