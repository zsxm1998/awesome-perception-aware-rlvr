  # ---------------------------------------------------------------------------
  # Perception / hallucination (greedy, single sample).
  # ---------------------------------------------------------------------------
  - key: pope
    label: POPE
    group: Perception
    loader: pope
    scorer: pope
    primary_metric: macro_f1
    source: lmms-lab/POPE (Full)
