# Evaluation suites: named benchmark lists that mirror the evaluation tables of the
# reproduced papers. Use them with `--suite NAME` (runner / scripts/eval.sh) and with the
# data preparation CLI (`bash scripts/prepare_eval_data.sh NAME`).
#
# Fields:
#   benchmarks: registry keys (eval/config/benchmarks.yaml), or `all` for every
#               non-optional benchmark
#   include:    other suites whose benchmarks are prepended (order preserved, no duplicates)
#   defaults:   runner options applied only when the flag is NOT given on the command line
#               (format_prompt, system_prompt, interaction_mode, agent_profile). Paths are
#               relative to the repository root; `none` disables the format prompt.
#   notes:      where our protocol differs from the paper's own evaluation
#
# Every reasoning benchmark is scored with the PAPO-Eval protocol (rule-based exact match on
# the last \boxed{}, mean accuracy over 8 samples at temperature 1.0, top_p 1.0).

suites:
  papo:
    description: PAPO Table 1 (5 general + 4 vision-dependent reasoning benchmarks)
    benchmarks: [geo3k, mathvista, wemath, mmk12, mathverse, logicvista, clevr_count, mmmu_pro, mathverse_v]
    notes: >-
      Same data (PAPO-Galaxy/PAPO_eval) and scoring as PAPO-Eval. The paper's "Counting
      (SuperClevr)" column is the 200-item BUAADreamer/clevr_count_70k split shipped with
      PAPO-Eval. The MathVista split keeps some free-form answers; like PAPO-Eval we still
      score them with rule-based exact match.

  vppo:
    description: VPPO Table 1 (8 reasoning benchmarks)
    benchmarks: [mathverse, dynamath, mmk12, geo3k, mathvision, wemath, logicvista, mmmu_pro]
    notes: >-
      DynaMath and MathVision come from chamber111/VPPO-Eval (filtered to verifiable
      answers); the other six are byte-identical to the PAPO-Eval splits. VPPO uses 4096
      new tokens for its 32B model; pass --max-new-tokens 4096 to match.

  dvrp:
    description: DVRP Table 1, general-domain columns
    benchmarks: [geo3k, mathvista, wemath, mathverse, mathverse_v, mmk12]
    notes: >-
      The medical half of the table (Slake, PathVQA, VQA-RAD, PMC-VQA) is not included.
      DVRP reports top_p 0.9 (text) / 0.99 (tables) at evaluation; we use 1.0 like PAPO.

  pgpo:
    description: PGPO Table 1 (8 reasoning benchmarks)
    benchmarks: [geo3k, mmk12, mathverse, dynamath, mathvision, logicvista, mmmu_pro, mathverse_v]
    notes: >-
      PGPO evaluates DynaMath "sample variant1" (501 items); we use the VPPO-Eval DynaMath
      file (3,666 verifiable items across variants).

  pepo:
    description: PEPO Table 1 (Geometry3K training) + Table 5 (ViRL39K scaling)
    benchmarks: [geo3k, mathvista, wemath, mathverse, logicvista, clevr_count, mmmu_pro]
    notes: >-
      Table 1 also reports Geometry3K val, which is not included. PEPO scores MathVista with
      the official MathVista checker and its Geometry3K models answer in <answer> tags; we
      use PAPO-Eval exact match (the scorer falls back to <answer>...</answer> when a response
      has no \boxed{}). Use the `pepo_geometry` suite for Geometry3K-trained models.

  pepo_geometry:
    description: PEPO Table 1 benchmarks, prompted like the Geometry3K-trained PEPO models
    benchmarks: [geo3k, mathvista, mathverse, logicvista]
    defaults:
      format_prompt: examples/format_prompt/r1v.jinja

  vepo:
    description: VEPO Table 1 (2 in-domain + 5 out-of-domain benchmarks)
    benchmarks: [geo3k, mmk12, hallusionbench, mathvista, wemath, mathverse, mathvision]
    defaults:  # the training prompt of examples/reproduction/vepo (VEPO's system prompt)
      format_prompt: none
      system_prompt: examples/system_prompt/vepo.txt
    notes: >-
      VEPO evaluates with greedy decoding and a gpt-4o-mini judge for MathVista, MathVerse,
      MathVision and We-Math; we use the rule-based PAPO-Eval protocol (avg@8, T=1.0). Add
      `--temperature 0 --num-samples 1` for greedy decoding.

  tor:
    description: ToR Table 4 (4 reasoning benchmarks + HallusionBench)
    benchmarks: [mathverse, mathvision, mathvista, wemath, hallusionbench]
    notes: >-
      ToR follows the NoisyRollout evaluation (greedy decoding, Gemini-2.0-Flash answer
      parsing); we use the rule-based PAPO-Eval protocol (avg@8, T=1.0).

  cfpo:
    description: CFPO Table 1 (5 real-world + 5 math benchmarks)
    benchmarks: [cvqa_real, mars_bench, pope, textvqa, mmmu_pro, geo3k, wemath, mmk12, mathverse, logicvista]
    notes: >-
      C-VQA-Real, MARS-Bench and TextVQA use CFPO's data and grading (avg@8, mathruler match
      on the last \boxed{} or on the whole response when there is none). CFPO's POPE_test.json
      holds the same 9,000 questions as lmms-lab/POPE; CFPO reports pooled accuracy with avg@8
      sampling, our POPE primary is greedy macro-F1 with the pooled accuracy in the details.
      CFPO evaluates its own models with a system prompt that asks for <think> and \boxed{};
      we use the training format prompt. CFPO's LogicVista file has 448 items (we use the
      447-item PAPO-Eval split).

  grit:
    description: GRIT Table 1 grounded-reasoning benchmarks
    benchmarks: [grit_vsr, grit_tallyqa, grit_gqa, ovdeval_position]
    defaults:
      format_prompt: none
      system_prompt: examples/system_prompt/grit_GR.txt
    notes: >-
      GRIT judges answers with GPT-4o; we use rule-based relaxed exact match. The GRIT-paper
      grounding IoU is reported as grounding/grit_iou in the metric details.

  deepeyes:
    description: DeepEyes high-resolution (Tables 1-2) and hallucination (POPE) benchmarks
    benchmarks: [vstar, hrbench_4k, hrbench_8k, mme_realworld_lite, pope]
    defaults:
      interaction_mode: agentic
      agent_profile: deepeyes
      format_prompt: none
      system_prompt: examples/system_prompt/deepeyes.txt
    notes: >-
      DeepEyes combines rule-based matching with a Qwen2.5-72B judge and feeds images of up to
      16384*28*28 pixels; we use rule-based option-letter matching and the runner's
      --max-pixels (pass --max-pixels 12845056 to match).
      Use `--interaction-mode one_shot --format-prompt <template>` for non-agent models.

  cgpo:
    description: CGPO (natural-image reproduction trained on ViRL39K) = the PAPO suite
    include: [papo]
    defaults:
      format_prompt: examples/format_prompt/xml_grounded_reasoning.jinja

  comparison:
    description: Union used by examples/comparison/ (PAPO + VPPO reasoning sets, POPE, HallusionBench)
    include: [papo, vppo]
    benchmarks: [pope, hallusionbench]

  perception:
    description: General perception / hallucination benchmarks (MM-Vet runs only with a judge)
    benchmarks: [pope, hallusionbench, mme, gqa, mm_vet]

  refcoco:
    description: Referring expression grounding (optional, ~0.5 GB of COCO images)
    benchmarks: [refcoco_val, refcoco_plus_val, refcocog_val]

  all:
    description: Every non-optional benchmark in the registry
    benchmarks: all
