# Evaluation suites: named benchmark lists that mirror the evaluation tables of the
# reproduced papers. Use them with `--suite NAME` (runner / scripts/eval.sh) and with the
# data preparation CLI (`bash scripts/prepare_eval_data.sh NAME`).
#
# Fields:
#   benchmarks: registry keys (eval/config/benchmarks.yaml), or `all` for every
#               non-optional benchmark
#   include:    other suites whose benchmarks are prepended (order preserved, no duplicates)
#   defaults:   runner options applied only when the flag is NOT given on the command line and the
#               model has no training record (format_prompt, system_prompt, chat_template,
#               plain_think_tokens, interaction_mode, agent_profile, min_pixels, max_pixels,
#               grounding_instruction, answer_protocol). Paths are relative to the repository root;
#               `none` disables the format prompt. A checkpoint trained in this repository is
#               evaluated with the prompt settings of its run's experiment_config.json and the chat
#               template saved with it instead (eval/README.md, "Prompts").
#   notes:      where our protocol differs from the paper's own evaluation
#
# Every reasoning benchmark is scored with the PAPO-Eval protocol (rule-based exact match on
# the last \boxed{}, mean accuracy over 8 samples at temperature 1.0, top_p 1.0).

suites:
  papo:
    description: PAPO Table 1 (5 general + 4 vision-dependent reasoning benchmarks)
    benchmarks: [geo3k, mathvista, wemath, mmk12, mathverse, logicvista, clevr_count, mmmu_pro, mathverse_v]
    notes: >-
      Same data (PAPO-Galaxy/PAPO_eval) and scoring as PAPO-Eval. The paper's "Counting
      (SuperClevr)" column is the 200-item BUAADreamer/clevr_count_70k split shipped with
      PAPO-Eval. The MathVista split keeps some free-form answers; like PAPO-Eval we still
      score them with rule-based exact match.

  vppo:
    description: VPPO Table 1 (8 reasoning benchmarks)
    benchmarks: [mathverse, dynamath, mmk12, geo3k, mathvision, wemath, logicvista, mmmu_pro]
    notes: >-
      DynaMath and MathVision come from chamber111/VPPO-Eval (filtered to verifiable
      answers); the other six have the same items as the PAPO-Eval splits. VPPO uses 4096
      new tokens for its 32B model; pass --max-new-tokens 4096 to match.

  dvrp:
    description: DVRP Table 1, general-domain columns
    benchmarks: [geo3k, mathvista, wemath, mathverse, mathverse_v, mmk12]
    notes: >-
      The medical half of the table (Slake, PathVQA, VQA-RAD, PMC-VQA) is not included.
      DVRP reports top_p 0.9 (text) / 0.99 (tables) at evaluation; we use 1.0 like PAPO.

  pgpo:
    description: PGPO Table 1 (8 reasoning benchmarks)
    benchmarks: [geo3k, mmk12, mathverse, dynamath, mathvision, logicvista, mmmu_pro, mathverse_v]
    notes: >-
      PGPO evaluates DynaMath "sample variant1" (501 items); we use the VPPO-Eval DynaMath
      file (3,666 verifiable items across variants). MathVision is VPPO-Eval's 2,907-item
      verifiable subset (PGPO lists 3,040).

  pepo:
    description: PEPO Table 1 (Geometry3K training) + Table 5 (ViRL39K scaling)
    benchmarks: [geo3k, mathvista, wemath, mathverse, logicvista, clevr_count, mmmu_pro]
    notes: >-
      Table 1 also reports Geometry3K val, which is not included. PEPO scores MathVista with
      the official MathVista checker and its Geometry3K models answer in <answer> tags; we
      use PAPO-Eval exact match (the scorer falls back to <answer>...</answer> when a response
      has no \boxed{}). Use the `pepo_geometry` suite for Geometry3K-trained models.

  pepo_geometry:
    description: PEPO Table 1 benchmarks, prompted like the Geometry3K-trained PEPO models
    benchmarks: [geo3k, mathvista, mathverse, logicvista]
    defaults:
      format_prompt: examples/format_prompt/pepo.jinja
      min_pixels: 3136  # images at their resolution, as examples/reproduction/pepo trains
      max_pixels: 12845056
      answer_protocol: pepo  # PEPO's evaluation prompts on MathVista/LogicVista/MathVerse; LogicVista letters

  vepo:
    description: VEPO Table 1 (2 in-domain + 5 out-of-domain benchmarks)
    benchmarks: [geo3k, mmk12, hallusionbench, mathvista, wemath, mathverse, mathvision]
    defaults:  # the training prompt of examples/reproduction/vepo (VEPO's system prompt)
      format_prompt: none
      system_prompt: examples/system_prompt/vepo.txt
    notes: >-
      VEPO evaluates with greedy decoding and a gpt-4o-mini judge for MathVista, MathVerse,
      MathVision and We-Math; we use the rule-based PAPO-Eval protocol (avg@8, T=1.0). Add
      `--temperature 0 --num-samples 1` for greedy decoding.

  tor:
    description: ToR Table 4 (4 reasoning benchmarks + HallusionBench)
    benchmarks: [mathverse, mathvision, mathvista, wemath, hallusionbench]
    notes: >-
      ToR follows the NoisyRollout evaluation (greedy decoding, Gemini-2.0-Flash answer
      parsing); we use the rule-based PAPO-Eval protocol (avg@8, T=1.0).

  cfpo:
    description: CFPO Table 1 (5 real-world + 5 math benchmarks)
    benchmarks: [cvqa_real, mars_bench, pope, textvqa, mmmu_pro, geo3k, wemath, mmk12, mathverse, logicvista]
    defaults:  # the training prompt of examples/reproduction/cfpo (CFPO's system prompt)
      format_prompt: none
      system_prompt: examples/system_prompt/cfpo.txt
    notes: >-
      C-VQA-Real, MARS-Bench and TextVQA use CFPO's data and grading (avg@8, mathruler match
      on the last \boxed{} or on the whole response when there is none). CFPO's POPE_test.json
      holds the same 9,000 questions as lmms-lab/POPE; CFPO reports pooled accuracy with avg@8
      sampling, our POPE primary is greedy macro-F1 with the pooled accuracy in the details.
      As CFPO, the models are prompted with CFPO's system prompt (<think> and \boxed{}).
      CFPO's LogicVista file has 448 items (we use the 447-item PAPO-Eval split).

  grit:
    description: GRIT Table 1 grounded-reasoning benchmarks
    benchmarks: [grit_vsr, grit_tallyqa, grit_gqa, ovdeval_position]
    defaults:  # GRIT's evaluation, as examples/reproduction/grit is trained
      format_prompt: examples/format_prompt/grit.jinja
      system_prompt: none
      grounding_instruction: none  # the question only
      min_pixels: 3136
      max_pixels: 200704
    notes: >-
      GRIT judges answers with GPT-4o; we use rule-based relaxed exact match. The GRIT-paper
      grounding IoU is reported as grounding/grit_iou in the metric details. These defaults are
      for models trained with GRIT's prompt; evaluate other models on these sets with
      --benchmarks grit_vsr,grit_tallyqa,grit_gqa,ovdeval_position and their own prompt flags
      (the box instruction is appended and the default pixels apply, as in --suite all), e.g.
      the comparison GRIT with --format-prompt none --system-prompt
      examples/system_prompt/grit_GR.txt.

  deepeyes:
    description: DeepEyes high-resolution (Tables 1-2) and hallucination (POPE) benchmarks
    benchmarks: [vstar, hrbench_4k, hrbench_8k, mme_realworld_lite, pope]
    defaults:
      interaction_mode: agentic
      agent_profile: deepeyes
      format_prompt: none
      system_prompt: examples/system_prompt/deepeyes.txt
    notes: >-
      DeepEyes combines rule-based matching with a Qwen2.5-72B judge and feeds images of up to
      16384*28*28 pixels; we use rule-based option-letter matching and the runner's
      --max-pixels (pass --max-pixels 12845056 to match).
      Use `--interaction-mode one_shot --format-prompt <template>` for non-agent models.

  va_opd:
    description: VA-OPD Table 1 (3 math reasoning + 4 visual understanding benchmarks; no OCRBench)
    benchmarks: [wemath, mathvista, mathverse, hallusionbench, ai2d, mmmu_val, mmstar]
    defaults:  # the training prompt and image size of examples/reproduction/va_opd
      format_prompt: examples/format_prompt/math.jinja
      min_pixels: 262144
      max_pixels: 4194304
    notes: >-
      VA-OPD reports avg@8 at temperature 1.0 under the official scoring protocols, with a GPT-4o
      judge where applicable, for the best checkpoint of each method (use --all-steps). We score
      with rules: We-Math, MathVista and MathVerse with the PAPO-Eval protocol (avg@8, T=1.0);
      HallusionBench, AI2D, MMMU (val) and MMStar are greedy by default (add `--temperature 1.0
      --num-samples 8` for avg@8; HallusionBench then scores the first sample only). The paper's
      MathVerse is testmini (its figures read MathVerse_mini); our `mathverse` is the PAPO-Eval
      file, the 2,180 multiple-choice testmini questions with an image, without the free-form
      ones. The paper does not say which HallusionBench metric it reports; our primary is aAcc
      (fAcc, qAcc and their mean aqf_mean are in the details). OCRBench is not available in this
      harness, so the paper's Visual Avg cannot be reproduced.

  vgs:
    description: VGS Table 1 benchmarks available here (4 of 7)
    benchmarks: [mathvision, mathverse_v, logicvista, mmmu_pro]
    defaults:  # the training prompt, image size and answer reading of examples/reproduction/vgs
      format_prompt: none
      system_prompt: examples/system_prompt/vgs.txt
      answer_protocol: vgs
      min_pixels: 262144
      max_pixels: 4194304
    notes: >-
      VGS reports Acc@1 (greedy) and Acc@16 (mean accuracy of 16 samples at T=1.0) with 2048 new
      tokens on MathVision, MathVerse Vision Dominant and Vision Only, LogicVista,
      VisualPuzzles, VlmsAreBlind and MMMU-Pro (4 options); the paper does not describe its
      answer scoring. We read the answers as the training reward of examples/reproduction/vgs
      does (`--answer-protocol vgs`: the last \boxed{}, else the text after </reason>; option
      letters for multiple-choice answers, mathruler otherwise). Our sets differ from the
      evaluation files of the VGS authors (MathVision 3,040 items, MathVerse VD / VO
      multiple-choice 432 / 436, LogicVista 448, MMMU-Pro 4-option 1,592): `mathvision` is
      VPPO-Eval's 2,907-item verifiable subset, `mathverse_v` is PAPO-Eval's 1,308-item
      vision-dependent split (one score), `logicvista` has 447 items and `mmmu_pro` is
      PAPO-Eval's 1,730-item vision setting. VisualPuzzles and VlmsAreBlind are not available.
      The decoding defaults are PAPO-Eval's (avg@8, T=1.0); add `--temperature 0 --num-samples
      1` for Acc@1 or `--num-samples 16` for Acc@16.

  vcsd:
    description: VCSD Table 1 (7 benchmarks; Acc. is their unweighted mean)
    benchmarks: [blink, mmstar, vstar, mathvista, hrbench_4k, hrbench_8k, hallusionbench]
    defaults:  # as examples/reproduction/vcsd trains: the bare problem, its template, tokenizer and images
      format_prompt: none
      system_prompt: none
      chat_template: examples/chat_template/qwen_no_thinking.jinja
      plain_think_tokens: "false"
      min_pixels: 262144
      max_pixels: 4194304
    notes: >-
      VCSD's HallusionBench score is (aAcc + fAcc + qAcc) / 3, reported here in the details as
      aqf_mean (our primary is aAcc), and its Acc. column averages the seven scores. The paper
      does not state its evaluation tool, prompts, decoding or answer extraction. We use greedy
      decoding and rule-based scoring, except for MathVista (PAPO-Eval testmini, avg@8 at T=1.0;
      add `--temperature 0 --num-samples 1` for greedy decoding everywhere). BLINK is the val
      split (1,901 questions). The paper reports step 90 of every run. The released models are
      asked with the template of the training scripts (an empty think block) and the released
      tokenizer, as the trained checkpoints are.

  vision_opd:
    description: Vision-OPD fine-grained (Table 1) and holdout (Table 2) benchmarks available here
    benchmarks: [vstar, zoombench, hrbench_4k, hrbench_8k, mme_realworld_lite, mmstar, pope]
    defaults:  # as examples/reproduction/vision_opd trains: the dataset prompt, its template and images
      format_prompt: none
      system_prompt: none
      chat_template: examples/chat_template/qwen_no_thinking.jinja
      min_pixels: 65536
      max_pixels: 16777216
    notes: >-
      Vision-OPD asks the dataset prompts without a system prompt (the defaults above), decodes
      greedily with up to 32768 new tokens and scores with mathruler, letter matching and a
      gpt-oss-120b judge; we score with rules (ZoomBench: the `zoombench` scorer,
      eval/README.md) and 2048 new tokens. Vision-OPD sends the original images to a vLLM
      server; the suite uses the training range of 65,536-16,777,216 pixels. The paper uses the
      full MME-RealWorld EN and CN sets; we have MME-RealWorld-Lite. MMVP and CV-Bench (holdout)
      are not available. POPE's primary here is macro-F1 (accuracy in the details); the paper
      does not say which POPE number it reports. The models are evaluated in non-thinking mode,
      as the paper does, with the template of the training scripts.

  cgpo:
    description: CGPO (natural-image reproduction trained on ViRL39K) = the PAPO suite
    include: [papo]
    defaults:
      format_prompt: examples/format_prompt/xml_grounded_reasoning.jinja

  comparison:
    description: Union used by examples/comparison/ (PAPO + VPPO reasoning sets, POPE, HallusionBench)
    include: [papo, vppo]
    benchmarks: [pope, hallusionbench]

  opd:
    description: Union used by examples/comparison/opd_qwen3_vl_2b (same as comparison)
    include: [comparison]

  perception:
    description: General perception / hallucination benchmarks (MM-Vet runs only with a judge)
    benchmarks: [pope, hallusionbench, mme, gqa, mm_vet]

  refcoco:
    description: Referring expression grounding (optional, ~0.5 GB of COCO images)
    benchmarks: [refcoco_val, refcoco_plus_val, refcocog_val]

  all:
    description: Every non-optional benchmark in the registry
    benchmarks: all
